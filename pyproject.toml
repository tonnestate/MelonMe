[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "melonme"
version = "0.1.0"
description = "Lean guerrilla monetization MCP sidecar for FruitStack"
requires-python = ">=3.11"
dependencies = ["mcp>=2,<3"]

[project.scripts]
melonme = "melonme.server:main"

[tool.setuptools.packages.find]
include = ["melonme*"]
