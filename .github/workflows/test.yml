name: MelonMe offline tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile
        run: python -m compileall -q melonme tests
      - name: Offline unit tests
        run: python -m unittest discover -s tests -v
      - name: Install MCP package
        run: python -m pip install -e .
      - name: Smoke import
        run: python -c "from melonme.server import mcp, find, execute, learn; print(type(mcp).__name__)"
